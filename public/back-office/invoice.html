<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ค้นหาและแก้ไข Invoice - Atom Group Phi Phi</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/back-office.css">

  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <!-- Navbar ส่วนหัวแสดงข้อมูลผู้ใช้งาน -->
  <nav class="navbar navbar-dark bg-dark px-3 shadow-sm mb-4">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-2">
        <button type="button" onclick="location.href='index.html'" class="btn btn-outline-warning btn-sm">
          <i class="bi bi-arrow-left"></i> หน้าหลัก
        </button>
        <span class="navbar-brand mb-0 h1 fs-6 ms-2">
          <i class="bi bi-search me-1 text-warning"></i>ระบบหลังบ้าน Atom Group Phi Phi
        </span>
      </div>
      
      <div class="d-none align-items-center text-white gap-3" id="userHeaderProfile">
        <div class="d-flex align-items-center">
          <img id="headerUserImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile" 
               class="rounded-circle me-2" style="width: 38px; height: 38px; object-fit: cover; border: 2px solid #deff9a;">
          <div class="lh-sm">
            <div class="fw-bold small" id="headerUserName">Loading...</div>
            <small class="text-white-50" style="font-size: 11px;">
              สิทธิ์: <span id="headerUserRole" class="text-warning text-uppercase">-</span>
            </small>
          </div>
        </div>
        <button id="btnLogout" class="btn btn-outline-light btn-sm" title="ออกจากระบบ">
          <i class="bi bi-box-arrow-right"></i> ออก
        </button>
      </div>
    </div>
  </nav>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <!-- Datalists สำหรับตัวเลือกในฟอร์มค้นหาและแก้ไข -->
  <datalist id="shopList"></datalist>
  <datalist id="supplierList"></datalist>

  <!-- พื้นที่หลักหน้าค้นหาและแก้ไข Invoice -->
  <div id="searchInvoiceSection" class="form-container container-fluid py-2 pb-5">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0 fs-5"><i class="bi bi-search me-2"></i>ค้นหาและแก้ไข Invoice</h4>
        <button type="button" class="btn btn-outline-light btn-sm" onclick="location.href='index.html'">
          <i class="bi bi-house-door"></i> กลับหน้าหลัก
        </button>
      </div>

      <div class="card-body">
        <!-- แถบค้นหาและตัวกรอง -->
        <div class="row g-2 mb-4 p-3 bg-light rounded border shadow-sm align-items-end">
          <div class="col-md-2">
            <label class="form-label small fw-bold">วันที่</label>
            <input type="date" id="filterDate" class="form-control form-control-sm" oninput="filterInvoices()">
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold">Supplier</label>
            <input type="text" id="filterSupplier" class="form-control form-control-sm" placeholder="ค้นชื่อผู้ขาย..." oninput="filterInvoices()">
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold">ร้าน</label>
            <input list="shopList" id="filterShop" class="form-control form-control-sm" placeholder="ระบุร้าน..." oninput="filterInvoices()">
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold">เลขใบเสร็จ</label>
            <input type="text" id="filterInvNo" class="form-control form-control-sm" placeholder="ค้นเลขที่ใบเสร็จ..." oninput="filterInvoices()">
          </div>
          <div class="col-md-1">
            <label class="form-label small fw-bold">จำนวนเงิน</label>
            <input type="number" id="filterAmount" class="form-control form-control-sm" placeholder="0.00" oninput="filterInvoices()">
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold">สถานะการจ่าย</label>
            <div class="btn-group btn-group-sm w-100" role="group">
              <input type="radio" class="btn-check" name="statusFilter" id="statusUnpaid" value="unpaid" onchange="openSearchInvoice('unpaid')" checked>
              <label class="btn btn-outline-danger" for="statusUnpaid">ค้างจ่าย</label>

              <input type="radio" class="btn-check" name="statusFilter" id="statusPaid" value="paid" onchange="openSearchInvoice('paid')">
              <label class="btn btn-outline-success" for="statusPaid">จ่ายแล้ว</label>
            </div>
          </div>
          <div class="col-md-1 d-flex align-items-end">
            <button type="button" class="btn btn-secondary btn-sm w-100" onclick="clearInvoiceFilter()" title="ล้างค่าการค้นหา">
              <i class="bi bi-x-circle"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2 px-1">
          <div class="small text-muted fw-bold" id="invoiceCountDisplay">แสดงทั้งหมด 0 รายการ</div>
        </div>

        <!-- ตารางแสดงผลรายการ Invoice -->
        <div class="table-responsive border rounded" style="max-height: 600px;">
          <table class="table table-hover align-middle mb-0" id="invoiceTable">
            <thead class="table-light sticky-top">
              <tr>
                <th>เลขที่ตั้งเบิก</th>
                <th>วันที่</th>
                <th>Supplier</th>
                <th>ร้าน</th>
                <th>เลขใบเสร็จ</th>
                <th class="text-end">จำนวนเงิน</th>
                <th class="text-center">จัดการ</th>
              </tr>
            </thead>
            <tbody id="invoiceResultBody">
              <tr>
                <td colspan="7" class="text-center py-5">
                  <div class="spinner-border text-primary"></div>
                  <p class="mt-2 mb-0 text-muted">กำลังโหลดข้อมูล...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal แก้ไขข้อมูล Invoice -->
  <div class="modal fade" id="editInvoiceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">แก้ไขข้อมูล Invoice: <span id="editDocNoDisplay"></span></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editInvoiceForm">
            <input type="hidden" id="editRowNum">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label"><b>วันที่เอกสาร</b></label>
                <input type="date" id="editDate" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label"><b>เลขที่ใบเสร็จ</b></label>
                <input type="text" id="editInvNo" class="form-control">
              </div>
              <div class="col-md-12">
                <label class="form-label"><b>รายการ</b></label>
                <input type="text" id="editDescription" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label"><b>Supplier</b></label>
                <input type="text" id="editSupplier" class="form-control" list="supplierList">
              </div>
              <div class="col-md-6">
                <label class="form-label"><b>ร้าน</b></label>
                <input type="text" id="editShop" class="form-control" list="shopList">
              </div>
              <div class="col-md-6">
                <label class="form-label"><b>จำนวนเงิน</b></label>
                <input type="number" id="editAmount" class="form-control" step="0.01">
              </div>

              <div class="col-12"><hr class="my-1"></div>

              <div class="col-md-6">
                <div class="form-check form-switch mt-2">
                  <input class="form-check-input" type="checkbox" id="editIsSet">
                  <label class="form-check-label fw-bold" for="editIsSet">ตั้งเบิกแล้ว</label>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold">ช่องทางการจ่าย</label>
                <select id="editPayChannel" class="form-select">
                  <option value="">-- เลือกช่องทาง --</option>
                  <option value="โอน">โอน</option>
                  <option value="transfer">transfer</option>
                  <option value="pay-in">pay-in</option>
                  <option value="Pay-in">Pay-in</option>
                  <option value="cash">cash</option>
                  <option value="Cash">Cash</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold">วันที่โอนจ่าย</label>
                <input type="date" id="editPayDate" class="form-control">
              </div>

              <div class="col-md-6">
                <div class="form-check form-switch mt-4">
                  <input class="form-check-input" type="checkbox" id="editIsPaid">
                  <label class="form-check-label fw-bold text-success" for="editIsPaid">จ่ายแล้ว</label>
                </div>
              </div>

              <div class="col-12"><hr class="my-1"></div>

              <div class="col-12 mb-2">
                <label class="form-label fw-bold text-secondary">ลิงก์ไฟล์ประวัติเดิม (Invoice)</label>
                <div id="urlDisplayArea" class="mb-2 p-2 border rounded bg-light text-center"></div>
                <div class="input-group">
                  <input type="file" id="editFileInput" class="form-control" accept="image/*,.pdf" multiple>
                  <label class="input-group-text" for="editFileInput"><i class="bi bi-upload me-1"></i> แนบไฟล์รวมเดิม</label>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold text-primary">ลิงก์ไฟล์ใบเสร็จ (Receipt)</label>
                <div id="receiptUrlDisplayArea" class="mb-2 p-2 border rounded bg-light text-center" style="min-height: 42px;"></div>
                <div class="input-group">
                  <input type="file" id="editReceiptInput" class="form-control" accept="image/*,.pdf">
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold text-success">ลิงก์ไฟล์สลิปโอนเงิน (Slip)</label>
                <div id="slipUrlDisplayArea" class="mb-2 p-2 border rounded bg-light text-center" style="min-height: 42px;"></div>
                <div class="input-group">
                  <input type="file" id="editSlipInput" class="form-control" accept="image/*,.pdf">
                </div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger me-auto" onclick="deleteInvoice()">
            <i class="bi bi-trash"></i> ลบรายการนี้
          </button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" class="btn btn-primary fw-bold" id="btnSaveEditInvoice" onclick="saveEditInvoice()">
            <i class="bi bi-save me-1"></i> บันทึกการแก้ไข
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal ยืนยันการลบ -->
  <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-danger text-white border-0">
          <h5 class="modal-title small"><i class="bi bi-exclamation-triangle"></i> ยืนยันการลบ</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center py-4">
          <p class="mb-0">ต้องการลบรายการของร้าน <br><strong id="deleteShopName"></strong> หรือไม่?</p>
          <small class="text-muted">ข้อมูลและไฟล์แนบในระบบจะถูกลบถาวร</small>
        </div>
        <div class="modal-footer border-0 justify-content-center">
          <button type="button" class="btn btn-light btn-sm px-3" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" class="btn btn-danger btn-sm px-3" id="btnConfirmDeleteFinal" onclick="executeDelete()">ลบทันที</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JS เฉพาะหน้า Invoice -->
  <script type="module" src="js/invoice.js"></script>
</body>
</html>
