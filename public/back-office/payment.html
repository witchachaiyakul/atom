<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกการจ่าย - Atom Group Phi Phi</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/back-office.css">

  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- Navbar ส่วนหัวแสดงข้อมูลผู้ใช้งาน -->
  <nav class="navbar navbar-dark bg-dark px-3 shadow-sm mb-4">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-2">
        <button type="button" onclick="location.href='index.html'" class="btn btn-outline-warning btn-sm">
          <i class="bi bi-arrow-left"></i> หน้าหลัก
        </button>
        <span class="navbar-brand mb-0 h1 fs-6 ms-2">
          <i class="bi bi-cash-coin me-1 text-warning"></i>ระบบหลังบ้าน Atom Group Phi Phi
        </span>
      </div>
      
      <div class="d-none align-items-center text-white gap-3" id="userHeaderProfile">
        <div class="d-flex align-items-center">
          <img id="headerUserImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile" 
               class="rounded-circle me-2" style="width: 38px; height: 38px; object-fit: cover; border: 2px solid #deff9a;">
          <div class="lh-sm">
            <div class="fw-bold small" id="headerUserName">Loading...</div>
            <small class="text-white-50" style="font-size: 11px;">
              สิทธิ์: <span id="headerUserRole" class="text-warning text-uppercase">-</span>
            </small>
          </div>
        </div>
        <button id="btnLogout" class="btn btn-outline-light btn-sm" title="ออกจากระบบ">
          <i class="bi bi-box-arrow-right"></i> ออก
        </button>
      </div>
    </div>
  </nav>

  <!-- Datalist รายชื่อร้านค้า -->
  <datalist id="shopList"></datalist>

  <!-- พื้นที่หลักหน้าบันทึกการจ่าย -->
  <div id="paymentRecord" class="form-container container-fluid py-2 pb-5">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0 fs-5">
          <i class="bi bi-list-check me-2"></i>เลือกรายการบันทึกการจ่าย 
          <small class="fs-6 opacity-75">(แสดงรายการตามสถานะที่เลือก)</small>
        </h4>
        <button type="button" class="btn btn-light btn-sm" onclick="location.href='index.html'">
          <i class="bi bi-house-door"></i> กลับหน้าหลัก
        </button>
      </div>
      
      <div class="card-body">
        <!-- แถบค้นหาและตัวกรอง -->
        <div class="row g-2 mb-4 p-3 bg-light rounded border shadow-sm">
          <div class="col-md-2">
            <label class="form-label small fw-bold text-secondary">เลขที่ตั้งเบิก</label>
            <input type="text" id="paySearchRef" class="form-control" placeholder="เลขที่ EXP..." oninput="filterPaymentList()">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold text-secondary">กรองตามชื่อ Supplier</label>
            <input type="text" id="paySearchSupplier" class="form-control" placeholder="ชื่อ Supplier..." oninput="filterPaymentList()">
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold text-secondary">กรองตามชื่อร้าน</label>
            <input list="shopList" id="paySearchShop" class="form-control" placeholder="ชื่อร้านค้า..." oninput="filterPaymentList()">
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold text-secondary">กรองตามยอดเงิน</label>
            <input type="number" id="paySearchAmount" class="form-control" placeholder="ระบุยอดเงิน..." oninput="filterPaymentList()">
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <button type="button" class="btn btn-primary w-100" onclick="loadPaymentRecordData()">
              <i class="bi bi-arrow-clockwise"></i> รีเฟรชข้อมูลจากระบบ
            </button>
          </div>

          <div class="col-12 mt-3 border-top pt-3">
            <label class="form-label small fw-bold text-secondary me-3">สถานะการตั้งเบิก:</label>
            <div class="btn-group" role="group">
              <input type="radio" class="btn-check" name="claimStatusFilter" id="statusClaimed" value="claimed" onchange="loadPaymentRecordData()" checked>
              <label class="btn btn-outline-success px-4" for="statusClaimed">ตั้งเบิกแล้ว</label>

              <input type="radio" class="btn-check" name="claimStatusFilter" id="statusNotClaimed" value="not_claimed" onchange="loadPaymentRecordData()">
              <label class="btn btn-outline-danger px-4" for="statusNotClaimed">ยังไม่ตั้งเบิก</label>
            </div>
          </div>
          
          <div class="d-flex justify-content-between align-items-center mb-1 px-1 mt-3 w-100">
            <div class="small text-muted fw-bold" id="searchCount">พบทั้งหมด 0 รายการ</div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-outline-primary" onclick="selectVisiblePayments(true)">
                <i class="bi bi-check-all"></i> เลือกทั้งหมดที่พบ
              </button>
              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="selectVisiblePayments(false)">
                <i class="bi bi-x-square"></i> ยกเลิกทั้งหมดที่พบ
              </button>
            </div>
          </div>
        </div>

        <!-- พื้นที่ตารางรายการค้างจ่าย -->
        <div id="paymentListArea" style="max-height: 420px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px;">
          <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2 text-muted">กำลังโหลดข้อมูล...</p>
          </div>
        </div>

        <!-- ส่วนบันทึกข้อมูลการจ่ายเงิน -->
        <div id="paymentProcessArea" class="mt-4 p-4 bg-white rounded border border-primary shadow d-none">
          <div class="row border-bottom mb-3 pb-2">
            <div class="col-12 d-flex justify-content-between align-items-center">
              <h5 class="text-primary mb-0"><i class="bi bi-wallet2 me-2"></i> บันทึกข้อมูลการจ่ายเงิน</h5>
              <div class="badge bg-info text-dark fs-6" id="selectedCountBadge">เลือกไว้ 0 รายการ</div>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-md-12 bg-light p-3 rounded mb-2 d-flex justify-content-between align-items-center">
              <span class="fw-bold fs-5">ยอดเงินรวมที่ต้องการจ่าย:</span>
              <span class="text-primary fs-3 fw-bold" id="totalPaymentAmount">0.00</span>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-bold"><i class="bi bi-credit-card-2-front me-1"></i> ช่องทางการจ่าย</label>
                <select id="payChannel" class="form-select">
                  <option value="" selected disabled>-- เลือกช่องทาง --</option>
                  <option value="pay-in">pay-in</option>
                  <option value="transfer">transfer</option>
                  <option value="cash">cash</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold"><i class="bi bi-calendar-event me-1"></i> วันที่จ่าย</label>
                <input type="date" id="payDate" class="form-control">
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold"><i class="bi bi-image me-1"></i> อัปโหลดสลิปการโอน</label>
              <input type="file" id="paySlipFile" class="form-control" accept="image/*,application/pdf">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold"><i class="bi bi-file-earmark-check me-1"></i> อัปโหลดใบเสร็จ</label>
              <input type="file" id="payReceiptFile" class="form-control" accept="image/*,application/pdf">
            </div>

            <div class="col-12 mt-4">
              <button type="button" class="btn btn-success btn-lg w-100 shadow-sm fw-bold" id="btnConfirmPayment" onclick="processPaymentUpdate()">
                <i class="bi bi-check-circle-fill me-2"></i> ยืนยันการบันทึกการจ่าย
              </button>
            </div>
          </div>
        </div>
      </div>
    </div> 
  </div>

  <!-- JS เฉพาะหน้า Payment -->
  <script type="module" src="js/payment.js"></script>
</body>
</html>
