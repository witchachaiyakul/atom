<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ค้นหา Audit Logs - Atom Group Phi Phi</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/back-office.css">

  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <!-- Navbar ส่วนหัวแสดงข้อมูลผู้ใช้งาน -->
  <nav class="navbar navbar-dark bg-dark px-3 shadow-sm mb-4 no-print">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-2">
        <button type="button" onclick="location.href='index.html'" class="btn btn-outline-warning btn-sm">
          <i class="bi bi-arrow-left"></i> หน้าหลัก
        </button>
        <span class="navbar-brand mb-0 h1 fs-6 ms-2">
          <i class="bi bi-shield-check me-1 text-warning"></i>ระบบหลังบ้าน Atom Group Phi Phi
        </span>
      </div>
      
      <div class="d-none align-items-center text-white gap-3" id="userHeaderProfile">
        <div class="d-flex align-items-center">
          <img id="headerUserImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile" 
               class="rounded-circle me-2" style="width: 38px; height: 38px; object-fit: cover; border: 2px solid #deff9a;">
          <div class="lh-sm">
            <div class="fw-bold small" id="headerUserName">Loading...</div>
            <small class="text-white-50" style="font-size: 11px;">
              สิทธิ์: <span id="headerUserRole" class="text-warning text-uppercase">-</span>
            </small>
          </div>
        </div>
        <button id="btnLogout" class="btn btn-outline-light btn-sm" title="ออกจากระบบ">
          <i class="bi bi-box-arrow-right"></i> ออก
        </button>
      </div>
    </div>
  </nav>

  <!-- พื้นที่หลักหน้าค้นหา Audit Logs -->
  <div id="AuditLogSection" class="container py-2 pb-5 form-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <button type="button" class="btn btn-outline-secondary btn-sm" onclick="location.href='index.html'">
        <i class="bi bi-arrow-left me-1"></i> กลับหน้าหลัก
      </button>
      <button type="button" class="btn btn-outline-primary btn-sm" onclick="resetAuditFilters()">
        <i class="bi bi-arrow-clockwise me-1"></i> ล้างตัวกรอง
      </button>
    </div>

    <div class="card shadow-sm border-0 p-4">
      <h4 class="fw-bold mb-3"><i class="bi bi-search me-2 text-primary"></i>ค้นหา Audit Logs</h4>

      <!-- ฟอร์มค้นหา -->
      <div class="row g-3 mb-4 bg-light p-3 rounded border">
        <div class="col-md-5">
          <label class="form-label fw-bold small">ชื่อผู้ใช้งาน (user_name)</label>
          <select id="searchUser" class="form-select" onchange="searchAuditLogs()">
            <option value="">-- ผู้ใช้งานทั้งหมด --</option>
          </select>
        </div>
        <div class="col-md-5">
          <label class="form-label fw-bold small">วันที่ (timestamp)</label>
          <input type="date" id="searchDate" class="form-control" onchange="searchAuditLogs()">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="button" id="btnSearchLogs" class="btn btn-primary w-100 fw-bold" onclick="searchAuditLogs()">
            <i class="bi bi-search me-1"></i> ค้นหา
          </button>
        </div>
      </div>

      <!-- ตารางแสดงผล -->
      <div class="table-responsive">
        <table class="table table-hover align-middle border">
          <thead class="table-light">
            <tr>
              <th style="width: 230px;">Timestamp</th>
              <th>Action & Details</th>
            </tr>
          </thead>
          <tbody id="auditLogTableBody">
            <tr>
              <td colspan="2" class="text-center text-muted py-4">
                <div class="spinner-border text-primary spinner-border-sm me-2"></div>กำลังโหลดข้อมูล...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- JS เฉพาะหน้า Audit Logs -->
  <script type="module" src="js/audit-log.js"></script>
</body>
</html>
