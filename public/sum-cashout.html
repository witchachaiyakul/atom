<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สรุปรายจ่าย (Cashout) - Atom Group Phi Phi</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/main.css">

  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <!-- Navbar ส่วนหัวแสดงข้อมูลผู้ใช้งาน -->
  <nav class="navbar navbar-dark bg-dark px-3 shadow-sm mb-4 no-print">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-2">
        <button type="button" onclick="location.href='index.html'" class="btn btn-outline-warning btn-sm">
          <i class="bi bi-arrow-left"></i> หน้าหลัก
        </button>
        <span class="navbar-brand mb-0 h1 fs-6 ms-2">
          <i class="bi bi-layout-split me-1 text-warning"></i>ระบบหลังบ้าน Atom Group Phi Phi
        </span>
      </div>
      
      <div class="d-none align-items-center text-white gap-3" id="userHeaderProfile">
        <div class="d-flex align-items-center">
          <img id="headerUserImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile" 
               class="rounded-circle me-2" style="width: 38px; height: 38px; object-fit: cover; border: 2px solid #deff9a;">
          <div class="lh-sm">
            <div class="fw-bold small" id="headerUserName">Loading...</div>
            <small class="text-white-50" style="font-size: 11px;">
              สิทธิ์: <span id="headerUserRole" class="text-warning text-uppercase">-</span>
            </small>
          </div>
        </div>
        <button id="btnLogout" class="btn btn-outline-light btn-sm" title="ออกจากระบบ">
          <i class="bi bi-box-arrow-right"></i> ออก
        </button>
      </div>
    </div>
  </nav>

  <!-- พื้นที่หลักหน้ารายจ่าย Cashout -->
  <div id="expenseSummarySection" class="form-container container py-2 pb-5">  
    <div class="d-flex justify-content-between align-items-center mb-3 no-print">
      <button type="button" class="btn btn-outline-secondary btn-sm" onclick="location.href='index.html'">
        <i class="bi bi-arrow-left"></i> กลับหน้าหลัก
      </button>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center p-3">
        <h4 class="mb-0 fw-bold fs-5"><i class="bi bi-layout-split me-2 text-warning"></i>รายจ่าย (Cashout)</h4>
      </div>
      
      <div class="card-body p-4">
        <div class="row g-3 mb-4 no-print border-bottom pb-4">
          <div class="col-md-2">
            <label class="form-label small fw-bold">ตั้งแต่วันที่</label>
            <input type="date" id="dateStart" class="form-control">
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold">ถึงวันที่</label>
            <input type="date" id="dateEnd" class="form-control">
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold">เลือกร้าน (Shop)</label>
            <select id="shopFilter" class="form-select">
              <option value="All">-- ทุกร้าน --</option>
              <option value="Atom">Atom</option>
              <option value="Atom_Beach">Atom Beach</option>
              <option value="Good_Time">Good Time</option>
              <option value="Paradise">Paradise</option>
              <option value="Tiger_King_Bar_&_Bistro">Tiger King Bar & Bistro</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold">ประเภทค่าใช้จ่าย</label>
            <select id="categoryFilter" class="form-select">
              <option value="All">-- ทุกประเภท --</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold">เลือก Supplier</label>
            <select id="supplierFilter" class="form-select">
              <option value="All">-- ทุก Supplier --</option>
            </select>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button type="button" class="btn btn-primary w-100 fw-bold" id="btnProcess" onclick="processFirestoreExpenseData()">
              <i class="bi bi-search me-1"></i> ประมวลผล
            </button>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-12">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-header bg-danger text-white p-3 d-flex justify-content-between align-items-center">
                <h6 class="mb-0 text-uppercase small fw-bold"><i class="bi bi-file-earmark-text me-1"></i> รายการ Cash Out</h6>
                <h2 class="fw-bold mb-0" id="totalCashOut">0.00</h2>
              </div>
              <div class="card-body p-0">
                <div id="tableCashOut" class="table-responsive" style="max-height: 600px;">
                  <p class="text-center text-muted py-5">รอการประมวลผล...</p>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- JS เฉพาะหน้าสรุปรายจ่าย Cashout -->
  <script type="module" src="js/sum-cashout.js"></script>
</body>
</html>
