<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สรุปยอดขายหัก Cash Out - Atom Group Phi Phi</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/main.css">

  <!-- Libraries: jQuery, Bootstrap, SweetAlert2, Chart.js -->
  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @media print {
      .no-print, nav.navbar {
        display: none !important;
      }
      .show-on-print {
        display: block !important;
      }
      body {
        background: #fff !important;
      }
      .card {
        box-shadow: none !important;
        border: none !important;
      }
      .card-header.bg-dark {
        background-color: #fff !important;
        color: #000 !important;
        border-bottom: 2px solid #000 !important;
        padding-left: 0 !important;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar ส่วนหัวแสดงข้อมูลผู้ใช้งาน -->
  <nav class="navbar navbar-dark bg-dark px-3 shadow-sm mb-4 no-print">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-2">
        <button type="button" onclick="location.href='index.html'" class="btn btn-outline-warning btn-sm">
          <i class="bi bi-arrow-left"></i> หน้าหลัก
        </button>
        <span class="navbar-brand mb-0 h1 fs-6 ms-2">
          <i class="bi bi-graph-up-arrow me-1 text-warning"></i>ระบบหลังบ้าน Atom Group Phi Phi
        </span>
      </div>
      
      <div class="d-none align-items-center text-white gap-3" id="userHeaderProfile">
        <div class="d-flex align-items-center">
          <img id="headerUserImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile" 
               class="rounded-circle me-2" style="width: 38px; height: 38px; object-fit: cover; border: 2px solid #deff9a;">
          <div class="lh-sm">
            <div class="fw-bold small" id="headerUserName">Loading...</div>
            <small class="text-white-50" style="font-size: 11px;">
              สิทธิ์: <span id="headerUserRole" class="text-warning text-uppercase">-</span>
            </small>
          </div>
        </div>
        <button id="btnLogout" class="btn btn-outline-light btn-sm" title="ออกจากระบบ">
          <i class="bi bi-box-arrow-right"></i> ออก
        </button>
      </div>
    </div>
  </nav>

  <!-- พื้นที่หลักหน้าสรุปยอดขาย -->
  <div id="summarySection" class="form-container container py-2 pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3 no-print">
      <button type="button" class="btn btn-outline-secondary btn-sm" onclick="location.href='index.html'">
        <i class="bi bi-arrow-left"></i> กลับหน้าหลัก
      </button>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center p-3">
        <h4 class="mb-0 fw-bold fs-5">
          <i class="bi bi-graph-up-arrow me-2 text-warning"></i>สรุปยอดขายหัก Cash Out 
          <small class="fw-normal text-warning d-block d-md-inline ms-md-2" style="font-size: 0.85rem;">
            (หมายเหตุ: ถ้าไม่บันทึก Cash Out ระบบจะแสดงยอดขาย = 0)
          </small>
        </h4>
      </div>
      
      <div class="card-body p-4">
        <!-- แถบเลือกวันที่และสาขา -->
        <div class="row g-3 mb-4 no-print border-bottom pb-4">
          <div class="col-md-3">
            <label class="form-label small fw-bold">ตั้งแต่วันที่</label>
            <input type="date" id="sumStartDate" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">ถึงวันที่</label>
            <input type="date" id="sumEndDate" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">เลือกร้าน/สาขา</label>
            <select id="sumStoreSelect" class="form-select">
              <option value="ทั้งหมด">ทั้งหมด</option>
              <option value="Atom">Atom</option>
              <option value="Atom Beach">Atom Beach</option>
              <option value="Good Time">Good Time</option>
              <option value="Paradise">Paradise</option>
              <option value="Tiger King Bar & Bistro">Tiger King Bar & Bistro</option>
            </select>
          </div>
          <div class="col-md-3 d-flex align-items-end gap-2">
            <button type="button" id="btnSearchSummary" class="btn btn-primary w-100 fw-bold" onclick="fetchSummary()">
              <i class="bi bi-search"></i> ค้นหา
            </button>
            <button type="button" class="btn btn-success w-100 fw-bold" onclick="printSummary()">
              <i class="bi bi-printer"></i> PDF
            </button>
          </div>
        </div>

        <!-- การ์ดสรุปยอดรวมด้านบน -->
        <div id="topSummaryCard" class="row g-2 mb-4 no-print"></div>

        <!-- กราฟแนวโน้มยอดขายรวมแยกตามสาขา -->
        <div class="card mb-4 no-print shadow-sm border-0 bg-light">
          <div class="card-header bg-white fw-bold small text-muted">
            <i class="bi bi-bar-chart-line me-1"></i> กราฟแนวโน้มยอดขายรวมแยกตามสาขา
          </div>
          <div class="card-body" style="height: 350px; position: relative;">
            <canvas id="salesChart"></canvas>
          </div>
        </div>

        <!-- พื้นที่ตารางรายงานและสั่งพิมพ์ -->
        <div id="printArea">
          <div class="text-center mb-4 show-on-print" style="display:none;">
            <h2 class="fw-bold">รายงานสรุปยอดขาย</h2>
            <p id="printPeriodText" class="text-muted lead"></p>
          </div>
          
          <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle bg-white">
              <thead class="table-dark text-center">
                <tr>
                  <th>วันที่</th>
                  <th>สาขา</th>
                  <th>VISA</th>
                  <th>Master</th>
                  <th>Transfer</th>
                  <th>Other</th>
                  <th>Cash</th>
                  <th class="bg-primary text-white">ยอดขายรวม</th>
                </tr>
              </thead>
              <tbody id="summaryTableBody" class="text-center">
                <tr>
                  <td colspan="8" class="py-5 text-muted">
                    <div class="spinner-border text-primary spinner-border-sm me-2"></div>กำลังโหลดข้อมูล...
                  </td>
                </tr>
              </tbody>
              <tfoot class="table-secondary fw-bold text-center" id="summaryTableFoot"></tfoot>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS เฉพาะหน้าสรุปยอดขาย -->
  <script type="module" src="js/sum-income.js"></script>
</body>
</html>
