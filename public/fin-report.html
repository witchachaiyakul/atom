<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สรุปผลประกอบการ (Income vs OCR) - Atom Group Phi Phi</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/main.css">

  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- Navbar ส่วนหัวแสดงข้อมูลผู้ใช้งาน -->
  <nav class="navbar navbar-dark bg-dark px-3 shadow-sm mb-4 no-print">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-2">
        <button type="button" onclick="location.href='index.html'" class="btn btn-outline-warning btn-sm">
          <i class="bi bi-arrow-left"></i> หน้าหลัก
        </button>
        <span class="navbar-brand mb-0 h1 fs-6 ms-2">
          <i class="bi bi-graph-up-arrow me-1 text-warning"></i>ระบบหลังบ้าน Atom Group Phi Phi
        </span>
      </div>
      
      <div class="d-none align-items-center text-white gap-3" id="userHeaderProfile">
        <div class="d-flex align-items-center">
          <img id="headerUserImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile" 
               class="rounded-circle me-2" style="width: 38px; height: 38px; object-fit: cover; border: 2px solid #deff9a;">
          <div class="lh-sm">
            <div class="fw-bold small" id="headerUserName">Loading...</div>
            <small class="text-white-50" style="font-size: 11px;">
              สิทธิ์: <span id="headerUserRole" class="text-warning text-uppercase">-</span>
            </small>
          </div>
        </div>
        <button id="btnLogout" class="btn btn-outline-light btn-sm" title="ออกจากระบบ">
          <i class="bi bi-box-arrow-right"></i> ออก
        </button>
      </div>
    </div>
  </nav>

  <!-- พื้นที่หลักหน้าสรุปผลประกอบการ -->
  <div id="financialReportSection" class="form-container container py-2 pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3 no-print">
      <button type="button" class="btn btn-outline-secondary btn-sm" onclick="location.href='index.html'">
        <i class="bi bi-arrow-left"></i> กลับหน้าหลัก
      </button>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-header bg-dark text-white p-3">
        <h4 class="mb-0 fw-bold fs-5"><i class="bi bi-graph-up-arrow me-2 text-warning"></i>สรุปผลประกอบการ (Income vs OCR)</h4>
      </div>
      
      <div class="card-body p-4">
        <!-- แถบเลือกช่วงวันที่และร้านค้า -->
        <div class="row g-3 mb-4 no-print border-bottom pb-4">
          <div class="col-md-3">
            <label class="form-label small fw-bold">ตั้งแต่วันที่</label>
            <input type="date" id="finStartDate" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">ถึงวันที่</label>
            <input type="date" id="finEndDate" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold">เลือกร้าน</label>
            <select id="finStoreSelect" class="form-select">
              <option value="ทั้งหมด">-- ทั้งหมด --</option>
              <option value="Atom">Atom</option>
              <option value="Atom Beach">Atom Beach</option>
              <option value="Good Time">Good Time</option>
              <option value="Paradise">Paradise</option>
              <option value="Tiger King Bar & Bistro">Tiger King Bar & Bistro</option>
            </select>
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <button type="button" id="btnProcessFin" class="btn btn-success w-100 fw-bold" onclick="fetchFinancialData()">
              <i class="bi bi-search me-1"></i> ประมวลผลข้อมูล
            </button>
          </div>
        </div>

        <!-- การ์ดสรุปผลประกอบการ 3 ช่อง -->
        <div class="row g-3 justify-content-center mb-4">
          <div class="col-md-4">
            <div class="p-3 border rounded bg-primary text-white shadow-sm text-center h-100 d-flex flex-column justify-content-center">
              <small class="text-uppercase fw-bold opacity-75">รายได้รวม (AA)</small>
              <h2 class="fw-bold mb-0" id="finTotalIncomeDisplay">0.00</h2>
            </div>
          </div>
          <div class="col-md-4">
            <div class="p-3 border rounded bg-danger text-white shadow-sm text-center h-100 d-flex flex-column justify-content-center">
              <small class="text-uppercase fw-bold opacity-75">รายจ่ายรวม (OCR)</small>
              <h2 class="fw-bold mb-0" id="finTotalOCRDisplay">0.00</h2>
              <div class="small mt-1 fw-bold" id="finExpensePercentDisplay">0%</div> 
            </div>
          </div>
          <div class="col-md-4">
            <div class="p-3 border rounded bg-success text-white shadow-sm text-center h-100 d-flex flex-column justify-content-center">
              <small class="text-uppercase fw-bold opacity-75">กำไรเบื้องต้น</small>
              <h2 class="fw-bold mb-0" id="finNetProfitDisplay">0.00</h2>
              <div class="small mt-1 fw-bold" id="finProfitPercentDisplay">0%</div>
            </div>
          </div>
        </div>
        
        <!-- ตารางเปรียบเทียบรายรับ-รายจ่าย -->
        <div class="table-responsive">
          <table class="table table-hover align-middle border">
            <thead class="table-light">
              <tr>
                <th>วันที่</th>
                <th>ร้านค้า</th>
                <th class="text-end text-primary">รายได้</th>
                <th class="text-end text-danger">รายจ่าย (OCR)</th>
              </tr>
            </thead>
            <tbody id="finSummaryTableBody">
              <tr>
                <td colspan="4" class="text-center text-muted py-5">
                  <div class="spinner-border text-success spinner-border-sm me-2"></div>กำลังโหลดข้อมูล...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- JS เฉพาะหน้าสรุปผลประกอบการ -->
  <script type="module" src="js/fin-report.js"></script>
</body>
</html>
